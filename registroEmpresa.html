<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Empresa</title>
    <link rel="stylesheet" href="style.css">
    <!--Font awesomw cdn link-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="icon" href="images/Logo-artesania.png">
</head>
<body>

        <div class="layout">

         
        <!--Header-->
        <header class="header">

            <img src="images/Logo-artesania.png" alt="" class="logo">
            
            <nav class="navbar">
                <a href="index.html">HOME</a>
                <a href="#productos">PRODUCTOS</a>
                <a href="SeleccionRegistro.html">REGISTRO</a>
                <a href="login.html">LOGIN</a>
            </nav>
            
             <!--Botón de menú-->
            <div id="menu-btn" class="fas fa-bars"></div>

        </header>


        
        <main class="contenedor-form">

            <div class="box-container">

                <h1 class="heading">REGISTRO EMPRESA</h1>

                    <div class="box-form">
                        
                        <form id="formEmpresa">
                            <div class="form-group">
                                <input type="text" id="empresa-nombre" placeholder="Nombre de la Empresa" class="box">
                                <span class="error" id="empresa-nombre-error"></span>
                            </div>

                            <div class="form-group">
                                <input type="email" id="empresa-email" placeholder="Correo electrónico" class="box">
                                <span class="error" id="empresa-email-error"></span>
                            </div>

                            <div class="form-group">
                                <input type="password" id="empresa-password" placeholder="Contraseña" class="box">
                                <span class="error" id="empresa-password-error"></span>
                            </div>

                            <input type="submit" id="btn-RE" value="Registrar" class="btn">
                        </form>  
                    </div>

                <p>¿Ya tienes una cuenta?<a href="login.html"><span> Inicia sesión</span></a></p>
                
            </div>

    
        </main>



        <footer class="footer">
                <div class="box-container">
                    <div class="box">
                        <img src="images/Logo-artesania.png" alt="">
                    </div>

                    <div class="box">
                        <h3>Síguenos</h3>
                        <a href="#"><i class="fab fa-facebook"></i>facebook</a>
                        <a href="#"><i class="fab fa-instagram"></i>instagram</a>
                    </div>

                    <div class="box">
                        <h3>Servicios</h3>
                        <a href="index.html"><i class="fas fa-check"></i>Home</a>
                        <a href="#productos"><i class="fas fa-check"></i>Productos</a>
                        <a href="SeleccionRegistro.html"><i class="fas fa-check"></i>Registro</a>
                        <a href="login.html"><i class="fas fa-check"></i>Login</a>
                    </div>
                    
                </div>

                <div class="credit"><span>creado por mr.Grupo | todo los derechos reservado</span> </div>

        </footer>
    </div>
 <script src="registroEmpresa.js"></script>
</body>
</html>
