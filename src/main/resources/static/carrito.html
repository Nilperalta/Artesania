<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras | Artesanía</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="images/Logo-artesania.png">
</head>

<body class="carrito-page">
  <main>
    <h2>Tu Carrito</h2>
    <table id="tabla-carrito">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="carrito-body"></tbody>
    </table>

    <div class="carrito-total">
      <h3 id="total">Total: S/ 0.00</h3>
      <a href="checkout.html" class="btn-checkout">Finalizar Compra</a>
    </div>
  </main>

  <script>
    // Cargar carrito desde localStorage
    const tbody = document.getElementById("carrito-body");
    const totalElement = document.getElementById("total");
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    function renderCarrito() {
      tbody.innerHTML = "";
      let total = 0;
      carrito.forEach((item, index) => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.nombre}</td>
          <td>${item.cantidad}</td>
          <td>S/ ${item.precio.toFixed(2)}</td>
          <td>S/ ${subtotal.toFixed(2)}</td>
          <td><button class="btn btn-sm btn-danger" onclick="eliminarItem(${index})">X</button></td>
        `;
        tbody.appendChild(tr);
      });
      totalElement.textContent = `Total: S/ ${total.toFixed(2)}`;
    }

    function eliminarItem(i) {
      carrito.splice(i, 1);
      localStorage.setItem("carrito", JSON.stringify(carrito));
      renderCarrito();
    }

    renderCarrito();
  </script>
</body>
</html>
