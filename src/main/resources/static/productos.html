<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Artesanía</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="icon" href="images/Logo-artesania.png">
</head>
<body class="productos-page">
  <div class="layout">

    <!-- HEADER -->
    <header class="header">
      <img src="images/Logo-artesania.png" alt="Logo Artesanía" class="logo">
      <nav class="navbar">
        <a href="index.html#home">HOME</a>
        <a href="#productos">PRODUCTOS</a>
        <a href="SeleccionRegistro.html">REGISTRO</a>
        <a href="login.html">LOGIN</a>
        <a href="carrito.html" class="btn btn-warning ms-3">
          <i class="fas fa-shopping-cart"></i> Carrito
        </a>
      </nav>
      <!-- Botón menú móvil -->
      <div id="menu-btn" class="fas fa-bars"></div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contenedor-maqueta">

      <!-- CATÁLOGO -->
      <section id="productos" class="container my-5">
        <div class="row" id="productos-container">
          <!-- Aquí JS insertará las tarjetas -->
        </div>
      </section>

      <!-- MODAL DETALLE -->
      <div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNombre"></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <div class="row">
                <div class="col-md-6">
                  <img id="modalImagen" src="" class="img-fluid rounded" alt="">
                </div>
                <div class="col-md-6">
                  <p id="modalDescripcion"></p>
                  <h4 class="text-success">S/ <span id="modalPrecio"></span></h4>
                  <label for="cantidad" class="form-label mt-2">Cantidad</label>
                  <input type="number" id="modalCantidad" value="1" min="1" class="form-control w-50">
                  <button class="btn btn-primary mt-3" id="btnAgregarCarrito">
                    <i class="fas fa-cart-plus"></i> Añadir al carrito
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="box-container">
        <div class="box">
          <img src="images/Logo-artesania.png" alt="Logo Artesanía">
        </div>

        <div class="box">
          <h3>Síguenos</h3>
          <a href="#"><i class="fab fa-facebook"></i> Facebook</a>
          <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
        </div>

        <div class="box">
          <h3>Servicios</h3>
          <a href="index.html#home"><i class="fas fa-check"></i> Home</a>
          <a href="#productos"><i class="fas fa-check"></i> Productos</a>
          <a href="SeleccionRegistro.html"><i class="fas fa-check"></i> Registro</a>
          <a href="login.html"><i class="fas fa-check"></i> Login</a>
        </div>
      </div>
      <div class="credit"><span>creado por mr.Grupo | todos los derechos reservados</span></div>
    </footer>

  </div>

  <!-- Bootstrap + JS productos -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="productos.js"></script>
</body>
</html>
