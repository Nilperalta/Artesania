<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Administrador</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <!-- Font Awesome para los íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- DASHBOARD ADMINISTRADOR -->
  <section class="dashboard-administrador">
    <h1 class="heading">Dashboard Administrador</h1>

    <div class="box-container">

      <div class="box">
        <i class="fas fa-users"></i>
        <h3>Gestión de Usuarios</h3>
        <p>Control de cuentas de compradores y vendedores.</p>
        <a href="#" class="btn">Ver más</a>
      </div>

      <div class="box">
        <i class="fas fa-chart-line"></i>
        <h3>Estadísticas</h3>
        <p>Revisa el desempeño de la plataforma.</p>
        <a href="#" class="btn">Ver más</a>
      </div>

      <div class="box">
        <i class="fas fa-cogs"></i>
        <h3>Configuración</h3>
        <p>Administra parámetros y ajustes generales.</p>
        <a href="#" class="btn">Configurar</a>
      </div>

      <!--<div class="box">
        <i class="fas fa-bell"></i>
        <h3>Notificaciones</h3>
        <p>Gestiona alertas importantes de la plataforma.</p>
        <a href="#" class="btn">Revisar</a>
      </div>-->

    </div>
  </section>

</body>
</html>
