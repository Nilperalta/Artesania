<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
   <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/Logo-artesania.png}">
</head>
<body>

    <div class="layout">
        <div class="admin-bar"><p>Administrador</p></div>
        
        <header class="header">
            <img th:src="@{/images/Logo-artesania.png}" alt="" class="logo">
            <nav class="navbar">
                <a th:href="@{/}">HOME</a>
                <a th:href="@{/#productos}">PRODUCTOS</a>
                <a href="#">VENTAS</a>
                <a th:href="@{/login}">SALIR</a>
            </nav>
            <div id="menu-btn" class="fas fa-bars"></div>
        </header>

        <main class="contenedor">
            <section class="panel-admin">
                <h1 class="heading-panel">TU PANEL DE CONTROL</h1>
                <div class="cards-grid">
                    <div class="card-admin">
                        <i class="fas fa-users icon-admin"></i>
                        <h3>Control de Cuentas</h3>
                        <p id="total-users" style="font-size: 2rem; color: var(--boton); font-weight: bold;">0</p>
                        <a th:href="@{/admin/controlcuentas}" class="btn">Ver Más</a>
                    </div>
                    <div class="card-admin">
                        <i class="fas fa-chart-line icon-admin"></i>
                        <h3>Estadísticas</h3>
                        <p id="total-compradores" style="font-size: 2rem; color: var(--boton); font-weight: bold;">0</p>
                        <a th:href="@{/admin/estadisticas}" class="btn">Ver Más</a>
                    </div>
                    <div class="card-admin">
                        <i class="fas fa-cog icon-admin"></i>
                        <h3>Ajustes</h3>
                        <p id="total-vendedores" style="font-size: 2rem; color: var(--boton); font-weight: bold;">0</p>
                        <a th:href="@{/admin/ajustes}" class="btn">Configurar</a>
                    </div>
                    <div class="card-admin">
                        <i class="fas fa-bell icon-admin"></i>
                        <h3>Alertas</h3>
                        <p id="total-admins" style="font-size: 2rem; color: var(--boton); font-weight: bold;">0</p>
                        <a th:href="@{/admin/alertas}" class="btn">Revisar</a>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="box-container">
                <div class="box"><img th:src="@{/images/Logo-artesania.png}" alt=""></div>
                <div class="box">
                    <h3>Síguenos</h3>
                    <a href="#"><i class="fab fa-facebook"></i>Facebook</a>
                    <a href="#"><i class="fab fa-instagram"></i>Instagram</a>
                </div>
                <div class="box">
                    <h3>Servicios</h3>
                    <a th:href="@{/#home}"><i class="fas fa-check"></i>Home</a>
                    <a th:href="@{/#productos}"><i class="fas fa-check"></i>Productos</a>
                    <a th:href="@{/SeleccionRegistro}"><i class="fas fa-check"></i>Registro</a>
                </div>
            </div>
            <div class="credit"><span>Creado Por Mr. Grupo | Todos Los Derechos Reservados</span></div>
        </footer>
    </div>

    <script>
let menu = document.querySelector('#menu-btn');
let navbar = document.querySelector('.navbar');
if(menu && navbar) {
    menu.onclick = () => {
        menu.classList.toggle('fa-times');
        navbar.classList.toggle('active');
    }
    window.onscroll = () => {
        menu.classList.remove('fa-times');
        navbar.classList.remove('active');
    }
}

fetch('/admin/api/stats')
    .then(r => r.json())
    .then(stats => {
        document.getElementById('total-users').textContent = stats.totalUsers;
        document.getElementById('total-compradores').textContent = stats.totalCompradores;
        document.getElementById('total-vendedores').textContent = stats.totalVendedores;
        document.getElementById('total-admins').textContent = stats.totalAdmins;
    });
    </script>
</body>
</html>
