<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="icon" th:href="@{/images/Logo-artesania.png}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');

        :root{
            --lineaMarron: #924f30;
            --EncabezadoHome: #78c6bd;
            --boton: #c06722;
            --boton-hover: #a0551d;
            --gris-oscuro: #2c2c2c;
            --light-color: #666;
            --box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.1);
        }

        *{
            font-family: "Nunito", sans-serif;
            margin: 0; padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            outline: none; border: none;
        }

        html{
            font-size: 62.5%;
            scroll-behavior: smooth;
        }

        body {
            background: #f8f9fa;
            min-height: 100vh;
        }

        /* Layout */
        .layout{
            display: grid;
            grid-template-areas: 
                "admin-bar"
                "header"
                "main"
                "footer";
            grid-template-rows: auto auto 1fr auto;
            min-height: 100vh;
        }

        .admin-bar {
            grid-area: admin-bar;
            background: var(--gris-oscuro);
            color: white;
            padding: 1rem 9%;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header{
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            grid-area: header;
            box-shadow: var(--box-shadow);
            padding: 1rem 9%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header .logo { height: 6.5rem; }

        .header .navbar a{
            font-size: 1.7rem;
            color: var(--light-color);
            margin-left: 2.5rem;
            font-weight: 600;
        }

        .header .navbar a:hover { color: var(--lineaMarron); }

        #menu-btn{
            display: none;
            font-size: 2.8rem;
            color: var(--lineaMarron);
            cursor: pointer;
        }

        /* Panel Principal */
        .panel-admin {
            padding: 5rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .heading-panel {
            text-align: center;
            font-size: 3.8rem;
            color: var(--EncabezadoHome);
            margin-bottom: 5rem;
            font-weight: 800;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
        }

        .card-admin {
            background: white;
            padding: 4rem 2.5rem;
            border-radius: 1.5rem;
            box-shadow: var(--box-shadow);
            text-align: center;
            transition: all 0.4s ease;
            border: 1px solid #eee;
        }

        .card-admin:hover {
            transform: translateY(-12px);
            box-shadow: 0 1.5rem 3rem rgba(0,0,0,0.15);
        }

        .card-admin .icon-admin {
            font-size: 6.5rem;
            color: var(--lineaMarron);
            margin-bottom: 2rem;
        }

        .card-admin h3 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .card-admin p {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--boton);
            margin: 1.5rem 0;
        }

        .card-admin .btn {
            display: inline-block;
            padding: 1.3rem 3.5rem;
            background: var(--boton);
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            border-radius: 50px;
            margin-top: 2rem;
            box-shadow: 0 6px 20px rgba(192, 103, 34, 0.4);
            transition: all 0.3s ease;
        }

        .card-admin .btn:hover {
            background: var(--boton-hover);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(192, 103, 34, 0.6);
        }

        /* Footer */
        .footer {
            background: #2c2c2c;
            color: white;
            padding: 4rem 9% 2rem;
            margin-top: 5rem;
        }

        .footer .box-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .footer .box h3 { font-size: 2rem; margin-bottom: 1.5rem; color: #78c6bd; }
        .footer .box a { display: block; color: #ccc; margin: 1rem 0; font-size: 1.5rem; }
        .footer .box a:hover { color: white; }

        .footer .credit {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid #444;
            font-size: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #menu-btn { display: block; }
            .header .navbar {
                position: absolute;
                top: 100%; right: 2rem;
                background: white;
                width: 30rem;
                border-radius: 1rem;
                box-shadow: var(--box-shadow);
                padding: 2rem;
                transform: scale(0);
                transform-origin: top right;
                opacity: 0;
            }
            .header .navbar.active {
                transform: scale(1);
                opacity: 1;
            }
            .header .navbar a {
                display: block;
                margin: 2rem 0;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="layout">
        <div class="admin-bar"><p>Administrador</p></div>
        
        <header class="header">
            <img th:src="@{/images/Logo-artesania.png}" alt="Logo" class="logo">
            <nav class="navbar">
                <a th:href="@{/}">HOME</a>
                <a th:href="@{/#productos}">PRODUCTOS</a>
                <a href="#">VENTAS</a>
                <a th:href="@{/admin/salir}">SALIR</a>
            </nav>
            <div id="menu-btn" class="fas fa-bars"></div>
        </header>

        <main>
            <section class="panel-admin">
                <h1 class="heading-panel">TU PANEL DE CONTROL</h1>
                
                <div class="cards-grid">
                    <div class="card-admin">
                        <i class="fas fa-users icon-admin"></i>
                        <h3>Control de Cuentas</h3>
                        <p id="total-users">0</p>
                        <a th:href="@{/admin/controlcuentas}" class="btn">Ver Más</a>
                    </div>

                    <div class="card-admin">
                        <i class="fas fa-chart-line icon-admin"></i>
                        <h3>Estadísticas</h3>
                        <p id="total-compradores">0</p>
                        <a th:href="@{/admin/estadisticas}" class="btn">Ver Más</a>
                    </div>

                    <div class="card-admin">
                        <i class="fas fa-cog icon-admin"></i>
                        <h3>Ajustes</h3>
                        <p id="total-vendedores">0</p>
                        <a th:href="@{/admin/ajustes}" class="btn">Configurar</a>
                    </div>

                    <div class="card-admin">
                        <i class="fas fa-bell icon-admin"></i>
                        <h3>Alertas</h3>
                        <p id="total-admins">0</p>
                        <a th:href="@{/admin/alertas}" class="btn">Revisar</a>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="box-container">
                <div class="box">
                    <img th:src="@{/images/Logo-artesania.png}" alt="Logo" style="height: 9rem;">
                </div>
                <div class="box">
                    <h3>Síguenos</h3>
                    <a href="#"><i class="fab fa-facebook"></i> Facebook</a>
                    <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
                </div>
                <div class="box">
                    <h3>Servicios</h3>
                    <a th:href="@{/#home}"><i class="fas fa-check"></i> Home</a>
                    <a th:href="@{/#productos}"><i class="fas fa-check"></i> Productos</a>
                    <a th:href="@{/SeleccionRegistro}"><i class="fas fa-check"></i> Registro</a>
                </div>
            </div>
            <div class="credit">
                <span>Creado Por Mr. Grupo | Todos Los Derechos Reservados</span>
            </div>
        </footer>
    </div>

    <script>
        // Menú móvil
        const menuBtn = document.getElementById('menu-btn');
        const navbar = document.querySelector('.navbar');
        menuBtn.onclick = () => {
            menuBtn.classList.toggle('fa-times');
            navbar.classList.toggle('active');
        };

        // Cargar estadísticas
        fetch('/admin/api/stats')
            .then(response => response.json())
            .then(data => {
                document.getElementById('total-users').textContent = data.totalUsuarios || 0;
                document.getElementById('total-compradores').textContent = data.totalCompradores || 0;
                document.getElementById('total-vendedores').textContent = data.totalVendedores || 0;
                document.getElementById('total-admins').textContent = data.totalAdmins || 0;
            })
            .catch(err => console.error('Error cargando stats:', err));
    </script>
</body>
</html>
