<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Estadísticas</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary: #c06722; 
            --bg: #f8f9fa; 
            --comprador: #27ae60;
            --vendedor: #f39c12;
            --admin: #e74c3c;
            --activo: #1abc9c;
            --inactivo: #95a5a6;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito',sans-serif; }
        body { background:var(--bg); padding-top:90px; padding-bottom:80px; min-height:100vh; }

        /* HEADER */
        header {
            position:fixed; top:0; left:0; right:0; background:white;
            box-shadow:0 4px 20px rgba(0,0,0,0.1); z-index:1000;
            padding:18px 40px; display:flex; justify-content:space-between; align-items:center;
        }
        .logo-preview { height:62px; object-fit:contain; }
        .back-btn {
            background:var(--primary); color:white; padding:14px 32px;
            border-radius:50px; text-decoration:none; font-weight:700; font-size:1.2rem;
            display:flex; align-items:center; gap:10px; transition:.3s;
        }
        .back-btn:hover {
            background:#d35400; transform:translateY(-3px);
            box-shadow:0 10px 30px rgba(192,103,34,0.35);
        }

        .container { max-width:1400px; margin:40px auto; padding:20px; }
        h1 { text-align:center; color:var(--primary); font-size:3.2rem; margin:30px 0 40px; font-weight:800; }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 50px;
        }

        @media (max-width: 992px) {
            .cards { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 576px) {
            .cards { grid-template-columns: 1fr; }
        }

        .card { 
            background:white; padding:30px; border-radius:16px; text-align:center; 
            box-shadow:0 10px 30px rgba(0,0,0,0.1); transition:.3s; 
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }
        .card:hover { transform:translateY(-8px); box-shadow:0 15px 40px rgba(0,0,0,0.15); }
        .card i { font-size:3rem; margin-bottom:15px; }
        .card.total i { color:#3498db; }
        .card.total::before { background:#3498db; }
        .card.comprador i { color:var(--comprador); }
        .card.comprador::before { background:var(--comprador); }
        .card.vendedor i { color:var(--vendedor); }
        .card.vendedor::before { background:var(--vendedor); }
        .card.admin i { color:var(--admin); }
        .card.admin::before { background:var(--admin); }
        .card.activo i { color:var(--activo); }
        .card.activo::before { background:var(--activo); }
        .card.inactivo i { color:var(--inactivo); }
        .card.inactivo::before { background:var(--inactivo); }
        .card h3 { font-size:1.1rem; color:#7f8c8d; margin:10px 0; font-weight:600; }
        .card .num { font-size:3.5rem; font-weight:900; color:#2c3e50; }
        .card .percent { font-size:1rem; color:#95a5a6; margin-top:5px; }

        /* GRÁFICOS */
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        @media (max-width: 992px) {
            .charts-container { grid-template-columns: 1fr; }
        }

        .chart-box { 
            background:white; padding:30px; border-radius:16px; 
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .chart-box h2 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* LEYENDA PERSONALIZADA */
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #555;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        footer { 
            position:fixed; bottom:0; left:0; right:0; background:#222; color:#aaa; 
            text-align:center; padding:20px; font-size:0.95rem; 
        }
        footer span { color: var(--primary); }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <img th:src="@{/images/Logo-artesania.png}" class="logo-preview" alt="Logo">
    <a th:href="@{/admin}" class="back-btn">
        <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </a>
</header>

<div class="container">
    <h1><i class="fas fa-chart-pie"></i> Mis Estadísticas</h1>

    <!-- TARJETAS DE ESTADÍSTICAS -->
    <div class="cards">
        <div class="card total">
            <i class="fas fa-users"></i>
            <h3>Total Usuarios</h3>
            <div class="num" th:text="${totalUsuarios}">0</div>
            <div class="percent">100%</div>
        </div>
        <div class="card comprador">
            <i class="fas fa-shopping-bag"></i>
            <h3>Compradores</h3>
            <div class="num" th:text="${totalCompradores}">0</div>
            <div class="percent" id="pctCompradores">0%</div>
        </div>
        <div class="card vendedor">
            <i class="fas fa-store"></i>
            <h3>Vendedores</h3>
            <div class="num" th:text="${totalVendedores}">0</div>
            <div class="percent" id="pctVendedores">0%</div>
        </div>
        <div class="card admin">
            <i class="fas fa-user-shield"></i>
            <h3>Administradores</h3>
            <div class="num" th:text="${totalAdmins}">0</div>
            <div class="percent" id="pctAdmins">0%</div>
        </div>
        <div class="card activo">
            <i class="fas fa-check-circle"></i>
            <h3>Usuarios Activos</h3>
            <div class="num" th:text="${usuariosActivos}">0</div>
            <div class="percent" id="pctActivos">0%</div>
        </div>
        <div class="card inactivo">
            <i class="fas fa-ban"></i>
            <h3>Usuarios Inactivos</h3>
            <div class="num" th:text="${usuariosInactivos}">0</div>
            <div class="percent" id="pctInactivos">0%</div>
        </div>
    </div>

    <!-- GRÁFICOS -->
    <div class="charts-container">
        <!-- Gráfico de Torta -->
        <div class="chart-box">
            <h2><i class="fas fa-chart-pie"></i> Distribución por Tipo de Usuario</h2>
            <div class="chart-wrapper">
                <canvas id="chartPie"></canvas>
            </div>
            <div class="legend-container" id="legendPie"></div>
        </div>

        <!-- Gráfico de Barras -->
        <div class="chart-box">
            <h2><i class="fas fa-chart-bar"></i> Cantidad por Tipo de Usuario</h2>
            <div class="chart-wrapper">
                <canvas id="chartBar"></canvas>
            </div>
            <div class="legend-container" id="legendBar"></div>
        </div>
    </div>
</div>

<footer>
    Creado por <span>Mr. Group</span> | Todos los derechos reservados © 2025
</footer>

<script th:inline="javascript">
    // Obtener datos desde Thymeleaf
    const totalUsuarios = /*[[${totalUsuarios}]]*/ 0;
    const totalCompradores = /*[[${totalCompradores}]]*/ 0;
    const totalVendedores = /*[[${totalVendedores}]]*/ 0;
    const totalAdmins = /*[[${totalAdmins}]]*/ 0;
    const usuariosActivos = /*[[${usuariosActivos}]]*/ 0;
    const usuariosInactivos = /*[[${usuariosInactivos}]]*/ 0;

    // Calcular porcentajes
    function calcularPorcentaje(valor, total) {
        if (total === 0) return 0;
        return ((valor / total) * 100).toFixed(1);
    }

    const pctCompradores = calcularPorcentaje(totalCompradores, totalUsuarios);
    const pctVendedores = calcularPorcentaje(totalVendedores, totalUsuarios);
    const pctAdmins = calcularPorcentaje(totalAdmins, totalUsuarios);
    const pctActivos = calcularPorcentaje(usuariosActivos, totalUsuarios);
    const pctInactivos = calcularPorcentaje(usuariosInactivos, totalUsuarios);

    // Mostrar porcentajes en las tarjetas
    document.getElementById('pctCompradores').textContent = pctCompradores + '%';
    document.getElementById('pctVendedores').textContent = pctVendedores + '%';
    document.getElementById('pctAdmins').textContent = pctAdmins + '%';
    document.getElementById('pctActivos').textContent = pctActivos + '%';
    document.getElementById('pctInactivos').textContent = pctInactivos + '%';

    // Colores
    const colores = {
        compradores: '#27ae60',
        vendedores: '#f39c12',
        admins: '#e74c3c'
    };

    // GRÁFICO DE TORTA
    const ctxPie = document.getElementById('chartPie').getContext('2d');
    new Chart(ctxPie, {
        type: 'doughnut',
        data: {
            labels: ['Compradores', 'Vendedores', 'Administradores'],
            datasets: [{
                data: [totalCompradores, totalVendedores, totalAdmins],
                backgroundColor: [colores.compradores, colores.vendedores, colores.admins],
                borderWidth: 0,
                hoverOffset: 10
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const valor = context.raw;
                            const porcentaje = calcularPorcentaje(valor, totalUsuarios);
                            return context.label + ': ' + valor + ' (' + porcentaje + '%)';
                        }
                    }
                }
            }
        }
    });

    // Leyenda personalizada para Torta
    document.getElementById('legendPie').innerHTML = `
        <div class="legend-item">
            <div class="legend-color" style="background:${colores.compradores}"></div>
            <span>Compradores: ${totalCompradores} (${pctCompradores}%)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:${colores.vendedores}"></div>
            <span>Vendedores: ${totalVendedores} (${pctVendedores}%)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:${colores.admins}"></div>
            <span>Admins: ${totalAdmins} (${pctAdmins}%)</span>
        </div>
    `;

    // GRÁFICO DE BARRAS
    const ctxBar = document.getElementById('chartBar').getContext('2d');
    new Chart(ctxBar, {
        type: 'bar',
        data: {
            labels: ['Compradores', 'Vendedores', 'Administradores'],
            datasets: [{
                label: 'Cantidad',
                data: [totalCompradores, totalVendedores, totalAdmins],
                backgroundColor: [colores.compradores, colores.vendedores, colores.admins],
                borderRadius: 8,
                barThickness: 60
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const valor = context.raw;
                            const porcentaje = calcularPorcentaje(valor, totalUsuarios);
                            return 'Cantidad: ' + valor + ' (' + porcentaje + '%)';
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        font: { size: 12 }
                    },
                    grid: { color: 'rgba(0,0,0,0.05)' }
                },
                x: {
                    ticks: { font: { size: 12, weight: '600' } },
                    grid: { display: false }
                }
            }
        }
    });

    // Leyenda para Barras
    document.getElementById('legendBar').innerHTML = `
        <div class="legend-item">
            <div class="legend-color" style="background:${colores.compradores}"></div>
            <span>Compradores</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:${colores.vendedores}"></div>
            <span>Vendedores</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:${colores.admins}"></div>
            <span>Administradores</span>
        </div>
    `;
</script>

</body>
</html>
