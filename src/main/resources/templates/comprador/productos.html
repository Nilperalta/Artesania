<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Artesanías Go</title>

  <!-- Bootstrap y fuentes -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="icon" th:href="@{/images/Logo-artesania.png}">
  <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body class="productos-page bg-light">
<div class="layout">

  <!-- Header -->
  <header class="header d-flex justify-content-between align-items-center p-3 bg-white shadow-sm">
    <img th:src="@{/images/Logo-artesania.png}" alt="Logo Artesanías Go" class="logo" style="height: 60px;">
    <nav class="navbar">
      <a th:href="@{/comprador}" class="me-3 text-dark fw-semibold">Inicio</a>
      <a th:href="@{/comprador/productos}" class="me-3 text-dark fw-semibold">Productos</a>
      <a th:href="@{/comprador/perfil}" class="me-3 text-dark fw-semibold">Perfil</a>
      <a th:href="@{/comprador/carrito}" class="btn btn-warning me-3">
        <i class="fas fa-shopping-cart"></i> Carrito
      </a>
      <a th:href="@{/comprador/salir}" class="text-danger fw-semibold">Salir</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container my-5">

    <h2 class="text-center mb-4 fw-bold text-primary">Nuestros Productos</h2>

    <!-- Mensaje si se agregó un producto -->
    <div th:if="${mensaje}" class="alert alert-success text-center fw-semibold" th:text="${mensaje}"></div>

    <div class="row g-4 justify-content-center">
      <!-- Iterar productos -->
      <div class="col-10 col-sm-6 col-md-4 col-lg-3" th:each="producto : ${productos}">
        <div class="card h-100 border-0 shadow-sm">
          <img th:src="@{/images/{img}(img=${producto.imagen})}" 
               class="card-img-top" 
               th:alt="${producto.nombre}" 
               style="height: 220px; object-fit: cover; border-radius: .5rem .5rem 0 0;">

          <div class="card-body text-center d-flex flex-column">
            <!-- Enlace al detalle del producto -->
            <h5 class="card-title fw-bold text-truncate">
              <a th:href="@{/comprador/producto/{id}(id=${producto.id})}" 
                 class="text-decoration-none text-dark"
                 th:text="${producto.nombre}">Producto</a>
            </h5>

            <p class="card-text text-muted small text-truncate mb-2" th:text="${producto.descripcion}"></p>
            <p class="text-success fw-bold mb-3">S/ <span th:text="${producto.precio}">0.00</span></p>

            <form th:action="@{/comprador/carrito/agregar}" method="post" class="mt-auto">
              <input type="hidden" name="productoId" th:value="${producto.id}">
              <div class="input-group mb-3">
                <input type="number" name="cantidad" value="1" min="1" class="form-control text-center" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-cart-plus me-1"></i> Añadir al carrito
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer bg-white py-4 mt-5 border-top">
    <div class="container text-center">
      <div class="row">
        <div class="col-md-4 mb-3">
          <img th:src="@{/images/Logo-artesania.png}" alt="Logo Artesanías" style="height: 70px;">
        </div>
        <div class="col-md-4 mb-3">
          <h5 class="fw-bold mb-2">Síguenos</h5>
          <a href="#" class="text-decoration-none text-dark d-block"><i class="fab fa-facebook"></i> Facebook</a>
          <a href="#" class="text-decoration-none text-dark d-block"><i class="fab fa-instagram"></i> Instagram</a>
        </div>
        <div class="col-md-4 mb-3">
          <h5 class="fw-bold mb-2">Servicios</h5>
          <a th:href="@{/comprador}" class="d-block text-dark text-decoration-none"><i class="fas fa-check"></i> Home</a>
          <a th:href="@{/comprador/productos}" class="d-block text-dark text-decoration-none"><i class="fas fa-check"></i> Productos</a>
          <a th:href="@{/comprador/perfil}" class="d-block text-dark text-decoration-none"><i class="fas fa-check"></i> Perfil</a>
          <a th:href="@{/comprador/carrito}" class="d-block text-dark text-decoration-none"><i class="fas fa-check"></i> Carrito</a>
        </div>
      </div>
      <div class="mt-3 text-muted small">
        Creado por <strong>mr.Grupo</strong> | Todos los derechos reservados © 2025
      </div>
    </div>
  </footer>

</div>
</body>
</html>
