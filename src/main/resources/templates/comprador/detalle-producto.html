<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${producto.nombre} + ' | Artesanías Go'">Detalle del Producto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body class="bg-light">

<div class="container py-5">
  <a th:href="@{/comprador/productos}" class="btn btn-outline-primary mb-4">
    <i class="fas fa-arrow-left"></i> Volver a Productos
  </a>

  <div class="card shadow-lg p-4 border-0 rounded-4">
    <div class="row g-4">
      <div class="col-md-5 text-center">
        <img th:src="@{/images/{img}(img=${producto.imagen})}"
             class="img-fluid rounded"
             th:alt="${producto.nombre}"
             style="max-height: 400px; object-fit: cover;">
      </div>

      <div class="col-md-7">
        <h2 class="fw-bold mb-3" th:text="${producto.nombre}">Nombre del Producto</h2>
        <p class="text-muted mb-3" th:text="${producto.descripcion}">Descripción detallada</p>
        <h4 class="text-success fw-bold mb-4">S/ <span th:text="${producto.precio}">0.00</span></h4>

        <form th:action="@{/comprador/carrito/agregar}" method="post" class="d-flex align-items-center">
          <input type="hidden" name="productoId" th:value="${producto.id}">
          <input type="number" name="cantidad" min="1" value="1" class="form-control w-25 me-3 text-center" required>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-cart-plus"></i> Añadir al carrito
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
