<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito | Artesanías Go</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
<link rel="icon" th:href="@{/images/Logo-artesania.png}">
<link rel="stylesheet" th:href="@{/style.css}">
</head>

<body class="bg-light">

<div class="layout">

<!-- HEADER -->
<header class="header">

<img th:src="@{/images/Logo-artesania.png}" alt="Logo" class="logo">

<nav class="navbar">
<a th:href="@{/comprador}">Inicio</a>
<a th:href="@{/comprador/productos}">Productos</a>
<a th:href="@{/comprador/perfil}">Perfil</a>
<a href="/comprador/carrito">
🛒 Carrito (<span th:text="${cantidadCarrito}">0</span>)
</a>
<a th:href="@{/comprador/salir}" style="color:red;">Salir</a>
</nav>

<div id="menu-btn" class="fas fa-bars"></div>

</header>


<!-- CONTENIDO -->
<main class="container my-5">

<h2 class="text-center mb-4 fw-bold text-primary">Mi Carrito 🛒</h2>

<div class="row g-4 justify-content-center">

<!-- SI EL CARRITO ESTÁ VACÍO -->
<div th:if="${#lists.isEmpty(carritoItems)}" class="text-center">
<h4 class="text-muted">Tu carrito está vacío</h4>
<a th:href="@{/comprador/productos}" class="btn btn-primary mt-3">
Ver productos
</a>
</div>

<!-- ITERAR PRODUCTOS DEL CARRITO -->
<div class="col-md-4" th:each="item : ${carritoItems}">

<div class="card shadow-sm h-100 text-center">

<img th:src="@{/images/{img}(img=${item.producto.imagen})}"
class="card-img-top"
style="height:200px; object-fit:cover;">

<div class="card-body d-flex flex-column">

<h5 class="card-title fw-bold"
th:text="${item.producto.nombre}">
Producto
</h5>

<p class="text-muted small"
th:text="${item.producto.descripcion}">
Descripción
</p>

<p class="mb-1">
Cantidad:
<strong th:text="${item.cantidad}"></strong>
</p>

<p class="text-success fw-bold">
S/ <span th:text="${item.subtotal}"></span>
</p>

<a th:href="@{/comprador/carrito/eliminar/{id}(id=${item.id})}"
class="btn btn-danger mt-auto">
<i class="fas fa-trash"></i> Eliminar
</a>

</div>

</div>

</div>

</div>

<!-- TOTAL -->
<div class="text-center mt-5" th:if="${!#lists.isEmpty(carritoItems)}">

<h4 class="fw-bold">
Total: S/ <span th:text="${total}"></span>
</h4>

<a th:href="@{/comprador/checkout}" class="btn btn-success mt-3">
<i class="fas fa-credit-card"></i> Proceder al pago
</a>

</div>

</main>


<!-- FOOTER -->
<footer class="footer">

<div class="box-container">

<div class="box">
<img th:src="@{/images/Logo-artesania.png}" alt="Logo">
</div>

<div class="box">
<h3>Síguenos</h3>
<a href="#"><i class="fab fa-facebook"></i> Facebook</a>
<a href="#"><i class="fab fa-instagram"></i> Instagram</a>
</div>

<div class="box">
<h3>Servicios</h3>
<a th:href="@{/comprador}"><i class="fas fa-check"></i> Home</a>
<a th:href="@{/comprador/productos}"><i class="fas fa-check"></i> Productos</a>
<a th:href="@{/comprador/perfil}"><i class="fas fa-check"></i> Perfil</a>
<a th:href="@{/comprador/carrito}"><i class="fas fa-check"></i> Carrito</a>
</div>

</div>

<div class="credit">
<span>Creado por mr.Grupo | Todos los derechos reservados</span>
</div>

</footer>

</div>

</body>
</html>
