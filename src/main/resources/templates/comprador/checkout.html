<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Artesanías Go</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="icon" th:href="@{/images/Logo-artesania.png}">
  <link rel="stylesheet" th:href="@{/style.css}">
  <link rel="stylesheet" th:href="@{/checkout.css}">
</head>

<body class="checkout-page bg-light">

  <!-- Header -->
  <header class="header d-flex justify-content-between align-items-center p-3 bg-white shadow-sm">
    <img th:src="@{/images/Logo-artesania.png}" alt="Logo Artesanías Go" class="logo" style="height: 60px;">
    <nav class="navbar">
      <a th:href="@{/comprador}" class="me-3 text-dark fw-semibold">Inicio</a>
      <a th:href="@{/comprador/productos}" class="me-3 text-dark fw-semibold">Productos</a>
      <a th:href="@{/comprador/carrito}" class="me-3 text-dark fw-semibold"><i class="fas fa-shopping-cart"></i> Carrito</a>
      <a th:href="@{/comprador/salir}" class="text-danger fw-semibold">Salir</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container my-5 checkout-container">
    <h2 class="text-center fw-bold mb-4">🧾 Confirmar Pedido</h2>

    <div class="card shadow-lg p-4" style="max-width: 800px; margin: 0 auto;">
      <!-- Mensaje de éxito -->
      <div th:if="${mensajeExito}" class="alert alert-success text-center fw-semibold" th:text="${mensajeExito}"></div>

      <!-- Resumen del pedido -->
      <div class="table-responsive mb-4">
        <table class="table align-middle text-center">
          <thead class="table-light">
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Precio Unitario</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${carritoItems}">
              <td th:text="${item.producto.nombre}">Producto</td>
              <td th:text="${item.cantidad}">1</td>
              <td>S/ <span th:text="${item.producto.precio}">0.00</span></td>
              <td>S/ <span th:text="${item.subtotal}">0.00</span></td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" class="fw-bold text-end">Total:</td>
              <td class="fw-bold text-success">S/ <span th:text="${total}">0.00</span></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Formulario de pago -->
      <form th:action="@{/comprador/checkout}" method="post" class="checkout-form">
        <div class="mb-3">
          <label for="direccion" class="form-label fw-semibold">Dirección de envío:</label>
          <input type="text" id="direccion" name="direccion" class="form-control" placeholder="Ej. Calle Los Artesanos 123" required>
        </div>

        <div class="mb-3">
          <label for="metodoPago" class="form-label fw-semibold">Método de pago:</label>
          <select id="metodoPago" name="metodoPago" class="form-select" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="efectivo">Efectivo al entregar</option>
            <option value="tarjeta">Tarjeta de crédito o débito</option>
          </select>
        </div>

        <!-- Simulación de pasarela (si elige tarjeta) -->
        <div id="tarjeta-info" class="tarjeta-section" style="display: none;">
          <label class="fw-semibold">Datos de la tarjeta:</label>
          <input type="text" class="form-control mb-2" placeholder="Número de tarjeta">
          <div class="row">
            <div class="col-md-6">
              <input type="text" class="form-control mb-2" placeholder="MM/AA">
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control mb-2" placeholder="CVV">
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="checkout-btn">
            <i class="fas fa-credit-card me-2"></i> Realizar Compra
          </button>
        </div>
      </form>

      <div class="text-center mt-4">
        <a th:href="@{/comprador/carrito}" class="btn btn-outline-secondary me-2">
          <i class="fas fa-arrow-left"></i> Volver al carrito
        </a>
        <a th:href="@{/comprador/productos}" class="btn btn-outline-primary">
          <i class="fas fa-store"></i> Seguir comprando
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer bg-white py-4 mt-5 border-top">
    <div class="container text-center">
      <p class="mb-0 text-muted small">Hecho con ❤️ por <strong>mr.Grupo</strong> | © 2025 Artesanías Go</p>
    </div>
  </footer>

  <script>
    // Mostrar campos de tarjeta solo si se elige ese método
    const metodoPago = document.getElementById('metodoPago');
    const tarjetaInfo = document.getElementById('tarjeta-info');
    metodoPago?.addEventListener('change', () => {
      tarjetaInfo.style.display = metodoPago.value === 'tarjeta' ? 'block' : 'none';
    });
  </script>
</body>
</html>
