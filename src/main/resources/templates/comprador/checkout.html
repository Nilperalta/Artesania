<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Artesanía</title>
    <link rel="stylesheet" href="/src/main/resources/static/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="images/Logo-artesania.png">
</head>

<body class="checkout-page">
  <main>
    <h2>Finalizar Compra</h2>

    <form class="checkout-form" id="checkoutForm">
      <label>Nombre Completo</label>
      <input type="text" required>

      <label>Correo Electrónico</label>
      <input type="email" required>

      <label>Dirección</label>
      <textarea rows="2" required></textarea>

      <label>Método de Pago</label>
      <select required>
        <option value="">Selecciona...</option>
        <option>Tarjeta</option>
        <option>Yape / Plin</option>
        <option>Contra Entrega</option>
      </select>

      <button type="submit" class="checkout-btn">Confirmar Compra</button>
    </form>

    <div id="animacionExito" class="animacion-exito" style="display:none;">
      <img src="/src/main/resources/static/images/cart-success.gif" alt="Compra exitosa" width="60">
      ¡Compra realizada con éxito!
    </div>
  </main>

  <script>
    document.getElementById("checkoutForm").addEventListener("submit", e => {
      e.preventDefault();
      const anim = document.getElementById("animacionExito");
      anim.style.display = "flex";

      setTimeout(() => {
        localStorage.removeItem("carrito");
        window.location.href = "index.html";
      }, 3000);
    });
  </script>
</body>
</html>
