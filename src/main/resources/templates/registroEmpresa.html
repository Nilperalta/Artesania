<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Empresa</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="icon" th:href="@{/images/Logo-artesania.png}">
</head>
<body>

<div class="layout">

    <!-- Header -->
    <header class="header">
        <img th:src="@{/images/Logo-artesania.png}" alt="" class="logo">

        <nav class="navbar">
            <a th:href="@{/}">HOME</a>
            <a href="#productos">PRODUCTOS</a>
            <a th:href="@{/seleccion-registro}">REGISTRO</a>
            <a th:href="@{/login}">LOGIN</a>
        </nav>

        <!-- Botón de menú -->
        <div id="menu-btn" class="fas fa-bars"></div>
    </header>

    <!-- Formulario -->
    <main class="contenedor-form">
        <div class="box-container">
            <h1 class="heading">REGISTRO EMPRESA</h1>

            <div class="box-form">
                <form th:action="@{/registro-empresa}" method="post">
                    <div class="form-group">
                        <input type="text" id="empresa-nombre" name="nombre" placeholder="Nombre de la Empresa" class="box" required>
                        <span class="error" id="empresa-nombre-error"></span>
                    </div>

                    <div class="form-group">
                        <input type="email" id="empresa-email" name="email" placeholder="Correo electrónico" class="box" required>
                        <span class="error" id="empresa-email-error"></span>
                    </div>

                    <div class="form-group">
                        <input type="password" id="empresa-password" name="password" placeholder="Contraseña" class="box" required>
                        <span class="error" id="empresa-password-error"></span>
                    </div>

                    <input type="submit" id="btn-RE" value="Registrar" class="btn">
                </form>
            </div>

            <p>¿Ya tienes una cuenta? <a th:href="@{/login}"><span>Inicia sesión</span></a></p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="box-container">
            <div class="box">
                <img th:src="@{/images/Logo-artesania.png}" alt="">
            </div>

            <div class="box">
                <h3>Síguenos</h3>
                <a href="#"><i class="fab fa-facebook"></i>facebook</a>
                <a href="#"><i class="fab fa-instagram"></i>instagram</a>
            </div>

            <div class="box">
                <h3>Servicios</h3>
                <a th:href="@{/}"><i class="fas fa-check"></i>Home</a>
                <a href="#productos"><i class="fas fa-check"></i>Productos</a>
                <a th:href="@{/seleccion-registro}"><i class="fas fa-check"></i>Registro</a>
                <a th:href="@{/login}"><i class="fas fa-check"></i>Login</a>
            </div>
        </div>

        <div class="credit"><span>creado por mr.Grupo | todos los derechos reservados</span></div>
    </footer>
</div>

<script th:src="@{/registroEmpresa.js}"></script>
</body>
</html>
