<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ajustes</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary: #c06722; --bg: #f8f9fa; --dark: #2c3e50; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito',sans-serif; }
        body { background:var(--bg); padding-top:90px; min-height:100vh; }
        
        /* HEADER LIMPIO */
        header {
            position:fixed; top:0; left:0; right:0; background:white;
            box-shadow:0 4px 20px rgba(0,0,0,0.1); z-index:1000;
            padding:18px 40px; display:flex; justify-content:space-between; align-items:center;
        }
        .logo-preview { height:62px; object-fit:contain; }
        
        .back-btn {
            background:var(--primary); color:white; padding:14px 32px;
            border-radius:50px; text-decoration:none; font-weight:700; font-size:1.2rem;
            display:flex; align-items:center; gap:10px; transition:.3s;
        }
        .back-btn:hover {
            background:#d35400; transform:translateY(-3px);
            box-shadow:0 10px 30px rgba(192,103,34,0.35);
        }

        .container { max-width:1000px; margin:40px auto; padding:30px; }
        h1 { text-align:center; color:var(--primary); font-size:3.6rem; margin-bottom:50px; font-weight:800; }
        .card { background:white; padding:45px; border-radius:22px; box-shadow:0 15px 45px rgba(0,0,0,0.12); }
        .card h2 { color:var(--primary); font-size:2.5rem; margin-bottom:35px; display:flex; align-items:center; gap:14px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:32px; }
        .field { margin-bottom:28px; }
        label { display:block; margin-bottom:10px; font-weight:600; color:var(--dark); font-size:1.15rem; }
        input, textarea {
            width:100%; padding:15px 18px; border:2px solid #e0e0e0; border-radius:14px;
            font-size:1.05rem; background:#fafafa; transition:.3s;
        }
        input:focus, textarea:focus {
            border-color:var(--primary); outline:none;
            box-shadow:0 0 0 4px rgba(192,103,34,0.18); background:white;
        }
        .preview { text-align:center; margin-top:18px; }
        .preview img { max-height:130px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.15); }
        .btn-save {
            background:var(--primary); color:white; padding:20px 80px; font-size:1.5rem;
            font-weight:700; border:none; border-radius:16px; cursor:pointer;
            display:block; margin:60px auto 20px; transition:.4s;
        }
        .btn-save:hover { background:#e67e22; transform:scale(1.06); box-shadow:0 15px 40px rgba(192,103,34,0.4); }
        footer { background:#222; color:#aaa; text-align:center; padding:30px; }
    </style>
</head>
<body>

<!-- HEADER LIMPIO: SOLO LOGO + VOLVER AL DASHBOARD -->
<header>
    <img src="/images/Logo-artesania.png" class="logo-preview" id="liveLogo" alt="Logo">
    <a th:href="@{/admin}" class="back-btn">
        Volver al Dashboard
    </a>
</header>

<div class="container">
    <h1>Ajustes del Sitio</h1>

    <div class="card">
        <h2>Parámetros Generales</h2>

        <div class="grid">
            <div class="field">
                <label>Dirección Física</label>
                <textarea rows="3">Av. Primavera 1234, Surco, Lima - Perú</textarea>
            </div>
            <div class="field">
                <label>Número de Contacto / WhatsApp</label>
                <input type="text" value="+51 999 999 999">
            </div>
            <div class="field">
                <label>Correo Electrónico</label>
                <input type="email" value="contacto@artesaniascertus.com">
            </div>
            <div class="field">
                <label>Logo Principal</label>
                <input type="file" id="logoInput" accept="image/*">
                <div class="preview">
                    <img id="previewLogo" src="/images/Logo-artesania.png" alt="Vista previa">
                    <small style="color:#777;margin-top:8px;display:block;">Se actualiza en tiempo real</small>
                </div>
            </div>
        </div>

        <button type="button" class="btn-save" onclick="alert('¡Cambios guardados exitosamente!')">
            GUARDAR CAMBIOS
        </button>
    </div>
</div>

<footer>
    © 2025 Artesanías Certus - Todos los derechos reservados
</footer>

<script>
    document.getElementById('logoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewLogo').src = e.target.result;
                document.getElementById('liveLogo').src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
