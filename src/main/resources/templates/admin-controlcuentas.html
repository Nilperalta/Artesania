<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Control de Cuentas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" th:href="@{/images/Logo-artesania.png}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        :root {
            --primary: #c06722;
            --primary-dark: #a85a1e;
            --success: #5cb85c;
            --info: #5bc0de;
            --warning: #f0ad4e;
            --danger: #d9534f;
            --gray: #6c757d;
            --light-gray: #999;
            --bg: #f8f9fa;
            --white: #fff;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
            --border: 1px solid #ddd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 80px;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--white);
            box-shadow: var(--shadow);
            z-index: 1000;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-preview {
            height: 60px;
            object-fit: contain;
        }

        .back-btn {
            background: var(--primary);
            color: var(--white);
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(192,103,34,0.3);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            color: #78c6bd;
            font-size: 2.8rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Filtros */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .filters input,
        .filters select {
            padding: 12px 20px;
            border: var(--border);
            border-radius: 8px;
            font-size: 14px;
            min-width: 200px;
            background: var(--white);
        }

        .filters input:focus,
        .filters select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Tabla */
        .table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #ececec;
            padding: 18px 15px;
            text-align: left;
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        td {
            padding: 15px;
            font-size: 14px;
            color: #555;
            border-bottom: var(--border);
        }

        tr:hover {
            background: #fafafa;
        }

        /* Estados */
        .estado {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--white);
        }

        .estado.activo {
            background: var(--success);
        }

        .estado.inactivo {
            background: var(--gray);
        }

        /* Botones de acción */
        .acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: var(--white);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .btn-editar {
            background: var(--info);
        }

        .btn-editar:hover {
            background: #46b8da;
        }

        .btn-estado {
            background: var(--warning);
        }

        .btn-estado:hover {
            background: #ec971f;
        }

        .btn-eliminar {
            background: var(--light-gray);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #78c6bd;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: var(--border);
            border-radius: 6px;
            background: #f8f9fa;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-cancelar {
            padding: 10px 20px;
            background: var(--gray);
            color: var(--white);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-guardar {
            padding: 10px 20px;
            background: #78c6bd;
            color: var(--white);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancelar:hover {
            background: #5a6268;
        }

        .btn-guardar:hover {
            background: #5fb3a7;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 8px;
            color: var(--white);
            font-size: 14px;
            font-weight: 600;
            z-index: 3000;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #333;
            color: #aaa;
            text-align: center;
            padding: 15px;
            font-size: 13px;
        }

        footer span {
            color: var(--primary);
        }

        /* Email sin capitalize */
        .email-cell {
            text-transform: lowercase !important;
        }

        @media (max-width: 768px) {
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .filters input,
            .filters select {
                width: 100%;
            }
            .acciones {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <img th:src="@{/images/Logo-artesania.png}" class="logo-preview" alt="Logo">
    <a th:href="@{/admin}" class="back-btn">
        <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </a>
</header>

<!-- Contenido -->
<div class="container">
    <h1>Control De Cuentas</h1>

    <div class="filters">
        <input type="text" id="searchInput" placeholder="Buscar por nombre o email...">
        <select id="filtroEstado">
            <option value="todos">Filtrar Estado</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
        </select>
        <select id="filtroRol">
            <option value="todos">Filtrar Rol</option>
            <option value="ADMIN">Administrador</option>
            <option value="VENDEDOR">Vendedor</option>
            <option value="COMPRADOR">Comprador</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nombre Del Usuario</th>
                    <th>Rol</th>
                    <th>Última Actividad</th>
                    <th>Email</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                <!-- Se carga dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<!-- Footer -->
<footer>
    Creado por <span>Mr. Group</span> | Todos los derechos reservados © 2025
</footer>

<!-- Modal Editar -->
<div class="modal-overlay" id="modalEditar">
    <div class="modal-content">
        <h2><i class="fas fa-user-edit"></i> Editar Usuario</h2>
        <form id="formEditar">
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label for="editNombre">Nombre</label>
                <input type="text" id="editNombre" required>
            </div>
            <div class="form-group">
                <label for="editEmail">Email</label>
                <input type="email" id="editEmail" required>
            </div>
            <div class="form-group">
                <label for="editRol">Rol</label>
                <select id="editRol">
                    <option value="COMPRADOR">Comprador</option>
                    <option value="VENDEDOR">Vendedor</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editEstado">Estado</label>
                <select id="editEstado">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" class="btn-guardar">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // =============================================
    // VARIABLES GLOBALES
    // =============================================
    const API_URL = '/admin/api/users';
    let usuariosData = [];

    // =============================================
    // FUNCIONES UTILITARIAS
    // =============================================
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function formatearFecha(fechaRaw) {
        if (!fechaRaw) return 'Sin registro';
        const date = new Date(fechaRaw);
        if (isNaN(date)) return 'Sin registro';
        return date.toLocaleDateString('es-PE', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // =============================================
    // RENDERIZAR TABLA
    // =============================================
    function renderizarTabla(usuarios) {
        const tbody = document.getElementById('tabla-body');
        
        if (usuarios.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;">No se encontraron usuarios</td></tr>';
            return;
        }

        tbody.innerHTML = usuarios.map(u => {
            const estadoClass = u.activo ? 'activo' : 'inactivo';
            const estadoTexto = u.activo ? 'Activo' : 'Inactivo';
            const btnEstadoTexto = u.activo ? 'Desactivar' : 'Activar';
            const btnEstadoIcon = u.activo ? 'fa-toggle-on' : 'fa-toggle-off';

            return `
                <tr>
                    <td>${u.nombre || 'Sin nombre'}</td>
                    <td>${u.rol || 'Sin rol'}</td>
                    <td>${formatearFecha(u.fechaRegistro)}</td>
                    <td class="email-cell">${u.email || 'Sin email'}</td>
                    <td><span class="estado ${estadoClass}">${estadoTexto}</span></td>
                    <td class="acciones">
                        <button class="btn btn-editar" onclick="abrirModalEditar(${u.id})">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <button class="btn btn-estado" onclick="cambiarEstado(${u.id})">
                            <i class="fas ${btnEstadoIcon}"></i> ${btnEstadoTexto}
                        </button>
                        <button class="btn btn-eliminar" disabled title="Próximamente">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // =============================================
    // CARGAR USUARIOS DESDE API
    // =============================================
    async function cargarUsuarios() {
        try {
            console.log('Cargando usuarios desde:', API_URL);
            const response = await fetch(API_URL);
            
            if (!response.ok) {
                throw new Error('Error HTTP: ' + response.status);
            }
            
            usuariosData = await response.json();
            console.log('Usuarios cargados:', usuariosData);
            renderizarTabla(usuariosData);
            
        } catch (error) {
            console.error('Error al cargar usuarios:', error);
            showToast('Error al cargar usuarios', 'error');
        }
    }

    // =============================================
    // FILTRAR TABLA
    // =============================================
    function filtrarTabla() {
        const busqueda = document.getElementById('searchInput').value.toLowerCase().trim();
        const estado = document.getElementById('filtroEstado').value;
        const rol = document.getElementById('filtroRol').value;

        const filtrados = usuariosData.filter(u => {
            const nombre = (u.nombre || '').toLowerCase();
            const email = (u.email || '').toLowerCase();
            const rolUsuario = (u.rol || '').toUpperCase();
            const estadoUsuario = u.activo ? 'activo' : 'inactivo';

            const matchBusqueda = nombre.includes(busqueda) || email.includes(busqueda);
            const matchEstado = estado === 'todos' || estadoUsuario === estado;
            const matchRol = rol === 'todos' || rolUsuario === rol;

            return matchBusqueda && matchEstado && matchRol;
        });

        renderizarTabla(filtrados);
    }

    // =============================================
    // MODAL EDITAR
    // =============================================
    function abrirModalEditar(id) {
        const usuario = usuariosData.find(u => u.id === id);
        
        if (!usuario) {
            showToast('Usuario no encontrado', 'error');
            return;
        }

        document.getElementById('editUserId').value = usuario.id;
        document.getElementById('editNombre').value = usuario.nombre || '';
        document.getElementById('editEmail').value = usuario.email || '';
        document.getElementById('editRol').value = usuario.rol || 'COMPRADOR';
        document.getElementById('editEstado').value = (usuario.activo === true).toString();

        document.getElementById('modalEditar').classList.add('active');
    }

    function cerrarModal() {
        document.getElementById('modalEditar').classList.remove('active');
    }

    // =============================================
    // GUARDAR EDICIÓN
    // =============================================
    document.getElementById('formEditar').addEventListener('submit', async function(e) {
        e.preventDefault();

        const id = document.getElementById('editUserId').value;
        const datos = {
            nombre: document.getElementById('editNombre').value,
            email: document.getElementById('editEmail').value,
            rol: document.getElementById('editRol').value
        };

        try {
            const response = await fetch(API_URL + '/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            if (!response.ok) {
                throw new Error('Error al actualizar');
            }

            showToast('Usuario actualizado correctamente', 'success');
            cerrarModal();
            cargarUsuarios();

        } catch (error) {
            console.error('Error:', error);
            showToast('Error al actualizar usuario', 'error');
        }
    });

    // =============================================
    // CAMBIAR ESTADO (ACTIVAR/DESACTIVAR)
    // =============================================
    async function cambiarEstado(id) {
        try {
            const response = await fetch(API_URL + '/' + id + '/toggle', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' }
            });

            if (!response.ok) {
                throw new Error('Error al cambiar estado');
            }

            showToast('Estado actualizado correctamente', 'success');
            cargarUsuarios();

        } catch (error) {
            console.error('Error:', error);
            showToast('Error al cambiar estado', 'error');
        }
    }

    // =============================================
    // EVENT LISTENERS
    // =============================================
    document.getElementById('searchInput').addEventListener('input', filtrarTabla);
    document.getElementById('filtroEstado').addEventListener('change', filtrarTabla);
    document.getElementById('filtroRol').addEventListener('change', filtrarTabla);

    // Cerrar modal al hacer clic fuera
    document.getElementById('modalEditar').addEventListener('click', function(e) {
        if (e.target === this) {
            cerrarModal();
        }
    });

    // =============================================
    // INICIAR
    // =============================================
    window.addEventListener('DOMContentLoaded', function() {
        console.log('Página Control de Cuentas cargada');
        cargarUsuarios();
    });
</script>

</body>
</html>
