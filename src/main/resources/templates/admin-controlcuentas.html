<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Control de Cuentas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="icon" href="images/Logo-artesania.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');

        :root{
            --lineaMarron:rgba(146, 89, 48, 1);
            --EncabezadoHome:rgba(120, 198, 189, 1);
            --black:#555;
            --light-color:#777;
            --bg:#fceae9;
            --border:.1rem solid rgba(0,0,0,.1);
            --box-shadow:0 .5rem 1.5rem rgba(0,0,0,.1);
            --encabezados:rgba(1, 1, 1, 1);
            --box-color: rgba(236, 236, 236, 1);
            --boton:#c06722;
            --activo: #5cb85c;
            --pendiente: #c06722;
            --suspendido: #d9534f;
        }

        *{
            font-family: "Nunito", sans-serif;
            margin: 0; padding: 0;
            box-sizing: border-box;
            outline: none; border: none;
            text-decoration: none;
            text-transform: capitalize;
            transition: all .3s ease-out;
        }

        html{
            font-size: 62.5%;
            scroll-behavior: smooth;
            scroll-padding-top: 9rem;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .layout{
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:  "header"
                                  "main"
                                  "footer";
            min-height: 100vh;
        }

        .layout .header{
            background: #fff;
            grid-area: header;
        }

        .layout .contenedor{
            background: #fff;
            grid-area: main;
        }

        .layout .footer{
            background: #ffdcc2;
            grid-area: footer;
        }

        /* Header */
        .header{
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: #fff;
            box-shadow: var(--box-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 9%;
        }

        .header .logo{
            height: 7rem;
        }

        .header .navbar{
            display: flex;
            align-items: center;
        }

        .header .navbar a{
            font-size: 1.7rem;
            color: var(--light-color);
            margin-left: 2rem;
        }

        .header .navbar a:hover{
            color: var(--lineaMarron);
        }

        #menu-btn{
            cursor: pointer;
            font-size: 2.5rem;
            padding: 1rem;
            border-radius: .5rem;
            color: var(--main-color);
            background: #ffdcc2;
            display: none;
            color: var(--lineaMarron);
        }

        #menu-btn:hover{
            color: #fff;
            background: var(--EncabezadoHome);
        }

        /* Contenedor */
        .contenedor{
            background: #fff;
        }

        /* Control de Cuentas */
        .control-cuentas {
            margin-top: 8rem;
            padding: 2rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .control-cuentas .heading-control {
            font-size: 3rem;
            color: var(--EncabezadoHome);
            margin-bottom: 3rem;
            text-align: center;
        }

        /* Filtros y búsqueda */
        .filtros-container {
            background: #fff;
            padding: 2rem;
            border-radius: 0.8rem;
            box-shadow: var(--box-shadow);
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .info-cuentas {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .info-cuentas h3 {
            font-size: 1.6rem;
            color: var(--encabezados);
        }

        .info-cuentas span {
            color: var(--EncabezadoHome);
            font-weight: bold;
        }

        .filtros-derecha {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 1rem 1rem 1rem 4rem;
            font-size: 1.4rem;
            border: var(--border);
            border-radius: 0.5rem;
            width: 25rem;
        }

        .search-box i {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--light-color);
            font-size: 1.6rem;
        }

        .filtro-select {
            padding: 1rem;
            font-size: 1.4rem;
            border: var(--border);
            border-radius: 0.5rem;
            background: #fff;
            color: var(--black);
            cursor: pointer;
            min-width: 15rem;
        }

        /* Tabla */
        .tabla-container {
            background: #fff;
            padding: 2rem;
            border-radius: 0.8rem;
            box-shadow: var(--box-shadow);
        }

        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 1.4rem;
        }

        .table th {
            background: #f8f9fa;
            padding: 1.5rem;
            text-align: left;
            font-weight: 600;
            color: var(--encabezados);
            border-bottom: var(--border);
            font-size: 1.5rem;
        }

        .table td {
            padding: 1.5rem;
            border-bottom: var(--border);
            color: var(--black);
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        .estado-badge {
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .estado-activo {
            background: var(--activo);
            color: #fff;
        }

        .estado-pendiente {
            background: var(--pendiente);
            color: #fff;
        }

        .estado-suspendido {
            background: var(--suspendido);
            color: #fff;
        }

        /* Paginación */
        .paginacion {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            gap: 0.5rem;
        }

        .paginacion button {
            padding: 1rem 1.5rem;
            font-size: 1.4rem;
            background: #fff;
            border: var(--border);
            color: var(--black);
            cursor: pointer;
            border-radius: 0.5rem;
        }

        .paginacion button:hover {
            background: var(--EncabezadoHome);
            color: #fff;
        }

        .paginacion .active {
            background: var(--EncabezadoHome);
            color: #fff;
            font-weight: bold;
        }

        .paginacion button:disabled {
            cursor: not-allowed;
            color: var(--light-color);
        }

        /* Responsive */
        @media(max-width: 991px){
            html{
                font-size: 55%;
            }

            .header{
                padding: 2rem;
            }

            .control-cuentas {
                padding: 2rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 768px){
            #menu-btn{
                display: inline-block;
            }

            .header .navbar{
                position: absolute;
                top: 99%; left: 0; right: 0;
                background: #fff;
                border-top: var(--border);
                border-bottom: var(--border);
                clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 1rem;
            }

            .header .navbar.active{
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }

            .header .navbar a{
                display: block;
                padding: 1.5rem;
                margin: 1.5rem 0;
                font-size: 2rem;
                background: var(--bg);
                width: 100%;
                text-align: center;
            }

            .control-cuentas {
                padding: 1.5rem;
            }

            .filtros-container {
                flex-direction: column;
                gap: 2rem;
            }

            .filtros-derecha {
                width: 100%;
                justify-content: center;
            }

            .search-box input {
                width: 100%;
            }

            .filtro-select {
                width: 100%;
            }

            .tabla-container {
                overflow-x: auto;
            }
        }

        @media(max-width: 450px){
            html{
                font-size: 50%;
            }

            .heading-control {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="layout">

        <!-- Header -->
        <header class="header">
            <img src="images/Logo-artesania.png" alt="" class="logo">
            
            <nav class="navbar">
                <a href="index.html">HOME</a>
                <a href="index.html#productos">PRODUCTOS</a>
                <a href="#">VENTAS</a>
                <a href="login.html">SALIR</a>
            </nav>

            <div id="menu-btn" class="fas fa-bars"></div>
        </header>

        <!-- Contenido principal -->
        <main class="contenedor">
            
            <section class="control-cuentas">
                <h1 class="heading-control">CONTROL DE CUENTAS</h1>

                <!-- Filtros -->
                <div class="filtros-container">
                    <div class="info-cuentas">
                        <h3>Todas Las Cuentas: <span>0</span></h3>
                    </div>

                    <div class="filtros-derecha">
                        <div class="search-box">
                            <input type="text" placeholder="Buscar..." id="searchInput">
                            <i class="fas fa-search"></i>
                        </div>
                        <select class="filtro-select" id="filtroEstado">
                            <option value="todos">Todos</option>
                            <option value="activo">Activo</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="suspendido">Suspendido</option>
                        </select>
                    </div>
                </div>

                <!-- Tabla -->
                <div class="tabla-container">
                    <table class="table table-hover" id="tablaCuentas">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre Del Usuario</th>
                                <th>Rol</th>
                                <th>Última Actividad</th>
                                <th>Email</th>
                                <th>País</th>
                                <th>Estado De Cuenta</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Aquí se llenará con JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginación -->
                <div class="paginacion">
                    <button id="btnPrev" disabled><i class="fas fa-chevron-left"></i></button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>...</button>
                    <button>89</button>
                    <button id="btnNext"><i class="fas fa-chevron-right"></i></button>
                </div>

            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="box-container">
                <div class="box">
                    <img src="images/Logo-artesania.png" alt="">
                </div>

                <div class="box">
                    <h3>Síguenos</h3>
                    <a href="#"><i class="fab fa-facebook"></i>facebook</a>
                    <a href="#"><i class="fab fa-instagram"></i>instagram</a>
                </div>

                <div class="box">
                    <h3>Servicios</h3>
                    <a href="index.html#home"><i class="fas fa-check"></i>Home</a>
                    <a href="index.html#productos"><i class="fas fa-check"></i>Productos</a>
                    <a href="SeleccionRegistro.html"><i class="fas fa-check"></i>Registro</a>
                    <a href="login.html"><i class="fas fa-check"></i>Login</a>
                </div>
            </div>

            <div class="credit"><span>creado por mr.Grupo | todos los derechos reservados</span></div>
        </footer>
    </div>

    <script>
        // Menú móvil
        const menu = document.querySelector('#menu-btn');
        const navbar = document.querySelector('.navbar');

        if(menu && navbar) {
            menu.onclick = () => {
                menu.classList.toggle('fa-times');
                navbar.classList.toggle('active');
            };
            window.onscroll = () => {
                menu.classList.remove('fa-times');
                navbar.classList.remove('active');
            };
        }

        // === CARGA DE USUARIOS ===
        const API_URL = '/admin/api/users';
        const tablaCuentas = document.getElementById('tablaCuentas');
        const searchInput = document.getElementById('searchInput');
        const filtroEstado = document.getElementById('filtroEstado');

        async function cargarUsuarios() {
            try {
                console.log("Cargando desde:", API_URL);
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const usuarios = await res.json();
                console.log("Usuarios recibidos:", usuarios);

                const tbody = tablaCuentas.querySelector('tbody');
                tbody.innerHTML = '';

                usuarios.forEach(u => {
                  const rol = 
                    u.rol === 'ADMIN' ? 'Administrador' :
                    u.rol === 'VENDEDOR' ? 'Vendedor' :
                    u.rol === 'COMPRADOR' ? 'Comprador' :
                    u.rol === 'MODERATOR' ? 'Vendedor' :
                    u.rol === 'USER' ? 'Comprador' : u.rol;

                    const estado = u.activo ? 'Activo' : 'Inactivo';
                    const clase = u.activo ? 'estado-activo' : 'estado-inactivo';
                    const fecha = u.fechaRegistro ? new Date(u.fechaRegistro).toLocaleDateString('es-PE') : '--';

                    tbody.innerHTML += `
                        <tr>
                            <td>${u.nombre}</td>
                            <td>${rol}</td>
                            <td>${fecha}</td>
                            <td>${u.email}</td>
                            <td>--</td>
                            <td><span class="estado-badge ${clase}">${estado}</span></td>
                        </tr>
                    `;
                });

                // Actualizar contador
                const span = document.querySelector('.info-cuentas span');
                if (span) span.textContent = usuarios.length;

            } catch (err) {
                console.error(err);
                const tbody = tablaCuentas.querySelector('tbody');
                tbody.innerHTML = `<tr><td colspan="6" style="color:red;">Error: ${err.message}</td></tr>`;
            }
        }

        // === FILTRO Y BÚSQUEDA ===
        function filtrarTabla() {
            const term = (searchInput?.value || '').toLowerCase();
            const estado = (filtroEstado?.value || 'todos').toLowerCase();
            const filas = tablaCuentas.querySelectorAll('tbody tr');

            filas.forEach(fila => {
                const nombre = fila.cells[0].textContent.toLowerCase();
                const email = fila.cells[3].textContent.toLowerCase();
                const badge = fila.querySelector('.estado-badge');
                const estadoTexto = badge ? badge.textContent.toLowerCase() : '';

                const matchSearch = nombre.includes(term) || email.includes(term);
                const matchEstado = estado === 'todos' || estadoTexto.includes(estado);

                fila.style.display = matchSearch && matchEstado ? '' : 'none';
            });
        }

        if (searchInput) searchInput.addEventListener('input', filtrarTabla);
        if (filtroEstado) filtroEstado.addEventListener('change', filtrarTabla);

        // === INICIAR ===
        window.addEventListener('load', () => {
            console.log("Página cargada. Iniciando carga de usuarios...");
            cargarUsuarios();
        });
    </script>
</body>
</html>
