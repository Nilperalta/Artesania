<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
  <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="icon" th:href="@{/images/Logo-artesania.png}">
</head>
<body>

    <div class="layout">

        <!-- Header -->
        <header class="header">
      <img th:src="@{/images/Logo-artesania.png}" alt="" class="logo">
            
      <nav class="navbar">
        <a th:href="@{/}">HOME</a>
        <a th:href="@{/vendedor/perfil}">MI PERFIL</a>
        <a th:href="@{/vendedor/productos}">MIS PRODUCTOS</a>
        <a th:href="@{/vendedor/ventas}">VENTAS</a>
        <a th:href="@{/login}">SALIR</a>
      </nav>

            <div id="menu-btn" class="fas fa-bars"></div>
        </header>

        <!-- Contenido principal -->
        <main class="contenedor">
            <section class="dashboard-vendedor">
             <h1 class="heading">Bienvenido, Vendedor 👋</h1>
            
            <h2 class="heading">Mi Perfil de Vendedor</h2>

      <div class="perfil-container">
        
        <!-- Imagen del perfil -->
        <div class="perfil-foto">
          <img th:src="${vendedor.foto}" alt="Foto">
          <button class="btn subir-foto"><i class="fas fa-camera"></i> Cambiar foto</button>
        </div>

        <!-- Datos personales -->
        <div class="perfil-datos">
          <form th:action="@{/vendedor/perfil/guardar}" method="post" 
      th:object="${vendedor}" class="form-perfil">

            <div class="campo">
              <label>Nombre:</label>
              <input type="text" name= "nombre"th:field="*{nombre}" readonly>
            </div>

            <div class="campo">
              <label>Correo electrónico:</label>
              <input type="email" name="correo" th:field="*{correo}" readonly>
            </div>

            <div class="campo">
              <label>Teléfono:</label>
              <input type="text" name="telefono" th:field="*{telefono}" readonly>
            </div>

            <div class="campo">
              <label>Dirección:</label>
              <input type="text" name="direccion" th:field="*{direccion}" readonly>
            </div>

            <div class="campo">
              <label>Descripción:</label>
              <textarea readonly th:field="*{descripcion}"></textarea>
            </div>

            <div class="botones">
              <button type="button" id="btn-editar" class="btn editar"><i class="fas fa-edit"></i> Editar</button>
              <button type="submit" id="btn-guardar" class="btn guardar" disabled>
                  <i class="fas fa-save"></i> Guardar
</button>
            </div>
          </form>
        </div>
      </div>
</section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="box-container">
        <div class="box">
          <img th:src="@{/images/Logo-artesania.png}" alt="">
        </div>

                <div class="box">
                    <h3>Síguenos</h3>
                    <a href="https://www.facebook.com"><i class="fab fa-facebook"></i>facebook</a>
                    <a href="https://www.instagram.com"><i class="fab fa-instagram"></i>instagram</a>
                </div>

                <div class="box">
                    <h3>Servicios</h3>
          <a th:href="@{/index.html#home}"><i class="fas fa-check"></i>Home</a>
          <a th:href="@{/index.html#productos}"><i class="fas fa-check"></i>Productos</a>
          <a th:href="@{/SeleccionRegistro.html}"><i class="fas fa-check"></i>Registro</a>
          <a th:href="@{/login}"><i class="fas fa-check"></i>Login</a>
                </div>
            </div>

            <div class="credit"><span>creado por mr.Grupo | todos los derechos reservados</span></div>
        </footer>
    </div>

  <script th:src="@{/script.js}"></script>
    <script>
        const btnEditar = document.getElementById('btn-editar');
        const btnGuardar = document.getElementById('btn-guardar');
        const inputs = document.querySelectorAll('.form-perfil input, .form-perfil textarea');

        btnEditar.addEventListener('click', () => {
        inputs.forEach(i => i.removeAttribute('readonly'));
        btnGuardar.removeAttribute('disabled');
        btnGuardar.classList.add('enabled');
        });

        btnGuardar.addEventListener('click', () => {
    // quitar preventDefault para permitir SUBMIT
    inputs.forEach(i => i.setAttribute('readonly', true));
    btnGuardar.setAttribute('disabled', true);
    btnGuardar.classList.remove('enabled');
});

    </script>
</body>
</html>
