spring.application.name=artesanias

spring.datasource.url=jdbc:mysql://localhost:3306/artesaniasdb
spring.datasource.username=root
spring.datasource.password=Root2024#

# JPA (para mapear las entidades automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.security=DEBUG

server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

# ================= GOOGLE OAUTH2 =================
spring.security.oauth2.client.registration.google.client-id=TU_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=TU_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email