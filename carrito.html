<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Artesanía</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="icon" href="images/Logo-artesania.png">
</head>
<body class="carrito-page">
  <div class="layout">

    <!-- HEADER -->
    <header class="header">
      <img src="images/Logo-artesania.png" alt="Logo Artesanía" class="logo">
      <nav class="navbar">
        <a href="index.html#home">HOME</a>
        <a href="productos.html">PRODUCTOS</a>
        <a href="SeleccionRegistro.html">REGISTRO</a>
        <a href="login.html">LOGIN</a>
        <a href="carrito.html" class="btn btn-warning ms-3">
          <i class="fas fa-shopping-cart"></i> Carrito
        </a>
      </nav>
      <!-- Botón menú móvil -->
      <div id="menu-btn" class="fas fa-bars"></div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container my-5">
      <h2 class="mb-4">🛒 Productos seleccionados</h2>
      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="carrito-body"></tbody>
      </table>
      <h3 class="text-end mt-4">Total: S/ <span id="total">0</span></h3>
      <div class="text-end">
        <a href="productos.html" class="btn btn-secondary">Seguir comprando</a>
        <button class="btn btn-success">Finalizar compra</button>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="box-container">
        <div class="box">
          <img src="images/Logo-artesania.png" alt="Logo Artesanía">
        </div>
        <div class="box">
          <h3>Síguenos</h3>
          <a href="#"><i class="fab fa-facebook"></i> Facebook</a>
          <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
        </div>
        <div class="box">
          <h3>Servicios</h3>
          <a href="index.html#home"><i class="fas fa-check"></i> Home</a>
          <a href="productos.html"><i class="fas fa-check"></i> Productos</a>
          <a href="SeleccionRegistro.html"><i class="fas fa-check"></i> Registro</a>
          <a href="login.html"><i class="fas fa-check"></i> Login</a>
        </div>
      </div>
      <div class="credit"><span>creado por mr.Grupo | todos los derechos reservados</span></div>
    </footer>

  </div>

  <!-- Bootstrap + lógica carrito -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    const cuerpo = document.getElementById("carrito-body");
    const totalSpan = document.getElementById("total");
    let total = 0;

    carrito.forEach(prod => {
      let subtotal = prod.precio * prod.cantidad;
      total += subtotal;
      cuerpo.innerHTML += `
        <tr>
          <td>${prod.nombre}</td>
          <td>S/ ${prod.precio}</td>
          <td>${prod.cantidad}</td>
          <td>S/ ${subtotal}</td>
        </tr>
      `;
    });

    totalSpan.textContent = total;
  </script>
</body>
</html>
